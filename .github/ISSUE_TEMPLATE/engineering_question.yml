name: 🔧 工程问题 / 选型咨询（Engineering question）
description: 具体工况怎么选型 / 结果怎么解读（也欢迎直接用 MCP 问 AI）
title: "[q] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        > 💡 **更快的办法**：把问题直接问接入了本插件的 AI —— 它会自动调用工具算给你看。
        > 见 https://mackorn.cn/ai/#mcp
        >
        > 这里适合**工具答不上来**的问题（比如：工具说"需要人工确认"，你想知道怎么确认）。

  - type: textarea
    id: task
    attributes:
      label: 你的工况
      description: 尽量给数（有多少给多少，缺的写"未知"）
      value: |
        - 目标成品产量：___ t/h
        - 原矿最大粒度：___ mm
        - 矿石种类与硬度：___（如 花岗岩 f=12-14 / 抗压强度 ___ MPa）
        - 成品粒度要求：___ mm 以下
        - 成品规格：___（如 0-5 / 5-10 / 10-20 / 20-31.5 mm）
        - 含土量 / 含水率：___ %
        - 生产方式：干法 / 湿法
        - 工作制：___ 小时/天，___ 天/年
        - 其他：___
    validations:
      required: true

  - type: textarea
    id: tool_said
    attributes:
      label: 工具给出的结果（如果跑过）
      description: 原样贴输出，包括 assumptions 与 warnings
      render: json

  - type: textarea
    id: question
    attributes:
      label: 你具体想问什么
      placeholder: |
        工具建议 2 台 NH400，但现场只能放 1 台的位置，能不能用 1 台 NS400 替代？
    validations:
      required: true

  - type: checkboxes
    id: ack
    attributes:
      label: 确认
      options:
        - label: 我理解这里的回答是**技术参考**，正式报价与方案需走商务渠道
          required: true
        - label: 我没有在 issue 里泄露客户名称或商业条款
          required: true
