name: Nightly self-iteration

# 把「夜间大干」交给云端：不依赖用户开机。
#
# 为什么用 GitHub Actions：
#   · 本仓库是【公开】仓库 → Actions 分钟数【免费且不限量】
#   · 支持 cron 定时触发，天然就是"夜间自动跑"
#   · 结果写回仓库（artifacts + commit），下次开机就能看到
#   · 不需要用户机器开机、不需要常驻服务器、不需要信用卡
#
# 每小时跑一轮：教训门禁 → 自迭代（累积证据）→ 公开基准 → 提交结果

on:
  schedule:
    # UTC。北京时间 = UTC+8。
    # 每 2 小时一轮，覆盖用户"晚上大干"的时段（北京 20:00–次日 08:00 = UTC 12:00–00:00）
    - cron: '0 12,14,16,18,20,22,0,2,4,6 * * *'
  workflow_dispatch:      # 支持手动触发
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - 'tools/**'
      - 'distribution/07_库/**'

permissions:
  contents: write

concurrency:
  group: nightly-self-iteration
  cancel-in-progress: false

jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ⚠️ 心跳必须在【最前面】且 always()：
      #   GitHub 会在公开仓库 60 天无活动后自动禁用定时工作流。
      #   而稳定项目往往没有变更 → 不提交 → 被禁用（悖论：跑得越好越会静默死掉）。
      #   心跳文件带时间戳，每次都变 → 每次都有提交 → 永远不会被禁用。
      - name: 云端心跳（防止 60 天无活动被自动禁用）
        if: always()
        run: node tools/cloud_heartbeat.mjs
      - name: 单元测试
        run: node tests/run.mjs

      - name: 硬事实同步（工具数/语言数）
        run: node tools/sync_tool_count_facts.mjs || true

      - name: CITATION 校验
        run: node tools/check_citation.mjs || true

      - name: 跨表一致性检查
        run: node tools/check_cross_table.mjs || true

      - name: 数据哨兵值扫描
        run: node tools/scan_sentinel_values.mjs || true

      - name: 全状态一览（省 token）
        run: node tools/status_now.mjs || true

      - name: 关键文件语法验证
        run: node tools/verify_changed_syntax.mjs plugin/index.mjs tools/lessons.mjs tools/enforce_lessons.mjs || true

      - name: 直接运行守卫审计
        run: node tools/audit_run_guards.mjs || true

      - name: 独立验证（Evertsson 真实参数）
        run: node tools/validate_evertsson_params.mjs || true

      - name: L2 经验教训门禁（全部可执行教训 + 库检查 + 护栏负控 + 物理不变量 + 硬事实 + 语法验证）
        run: node tools/enforce_lessons.mjs

      - name: 公开验证基准（26 项，零依赖）
        run: node distribution/03_验证与基准/公开基准/run-benchmark.mjs

      - name: L3 自迭代循环（累积试验、写回经验库与错误库）
        run: node tools/self_iterate.mjs

      - name: 模型自验证
        # continue-on-error 的理由（如实说明，不是掩盖）：
        #   本步骤含"JS 本地 vs 线上 PHP 双实现一致性"检查。
        #   在用户上传新版 PHP 之前，这条【必然失败】（线上仍是旧算法，差约 28%）。
        #   把它设成允许失败，是为了不让一个【已知待办】阻塞其余全部检查；
        #   但它仍会出现在运行摘要里，不会被隐藏。
        #   ⚠️ 上传新版 PHP 后，若此步仍失败，说明是真回归 —— 应立刻处理。
        continue-on-error: true
        run: node tools/validate_model.mjs

      - name: 库验证（经验/错误）
        run: node tools/verify_libraries.mjs

      - name: 合规与版本门禁
        run: node tools/build_public.mjs

      - name: 云端工作流本地预演
        run: node tools/workflow_dryrun.mjs

      - name: 蓝图门禁自检（G1-G5 + 负控）
        run: |
          node tools/check_blueprint_compliance.mjs
          node tests/negative/plugin_negative_controls.mjs
          node tests/negative/guardrail_negative_controls.mjs
          node tools/g1_calibration_test.mjs

      - name: 工具描述审计
        run: node tools/audit_tool_descriptions_v2.mjs

      - name: 用户验收测试
        run: |
          node tools/uat_user_scenarios.mjs
          node tools/uat_business_scenarios.mjs
          node tools/uat_diagnostic_scenarios.mjs

      - name: 全站审计
        run: node tools/audit_site.mjs

      - name: 导出 Harness 约束（供接手的 Agent 读）
        run: node tools/export_harness.mjs || true

      # ══════ R138：AI 目录收录（每 3 天检查一次，其余时间跳过）══════
      - name: 判断是否到了 AI 目录检查期（每3天）
        id: dir_due
        run: |
          DUE=$(node -e "
            const fs=require('fs');
            try {
              const j=JSON.parse(fs.readFileSync('directory-registry/registry.json','utf8'));
              const last=new Date(j.rhythm?.last_check||'1970-01-01').getTime();
              const days=(Date.now()-last)/86400000;
              console.log(days >= 3 ? 'yes' : 'no');
            } catch { console.log('yes'); }
          ")
          echo "due=$DUE" >> $GITHUB_OUTPUT
          echo "AI 目录检查：$DUE（周期 3 天）"

      - name: AI 目录收录检查（到期才跑）
        if: steps.dir_due.outputs.due == 'yes'
        run: node tools/directory_checker.mjs --check || true

      - name: 生成目录更新材料（到期才跑）
        if: steps.dir_due.outputs.due == 'yes'
        run: node tools/directory_uploader.mjs --all || true

      # ══════ R151：自动认知发现器（六类缺口扫描）══════
      - name: 自动认知发现（承诺/数字/文件/死链/过期/复现）
        run: node tools/cognition_auto.mjs || true

      - name: 自动认知发现器负控（必须 5/5）
        run: node tests/negative/cognition_auto_negative_controls.mjs

      - name: 认知力台账（每天必须推翻自己）
        run: node tools/cognition_log.mjs --check || true

      # ══════ R139：证书监控（提前 30/14/7 天预警）══════
      - name: 证书与域名监控
        run: node tools/cert_monitor.mjs || true

      - name: 线上健康（证书/官网/API/llms.txt）
        run: node tools/check_live_health.mjs || true

      - name: 上传一致性（先升级再上传）
        run: node tools/check_upload_consistency.mjs || true

      - name: 发布节奏 + AI 友好度
        run: |
          node tools/publish_rhythm.mjs || true
          node tools/ai_appeal.mjs || true

      - name: RSI 闭环完整性
        run: node tools/rsi_record.mjs --check-loop || true

      - name: RSI 缺陷台账核验（recurrence）
        run: node tools/rsi_register.mjs || true

      - name: RSI 判级（递归自我改进的可测闭环）
        run: node tools/rsi_level.mjs || true

      - name: 机会生存法则检查
        run: node tools/check_survival_law.mjs || true

      - name: JS↔PHP 一致性对照（本地 vs 远程端点）
        run: node tools/check_js_php_parity.mjs || true

      - name: 线上状态核实
        run: node tools/check_live_state.mjs

      - name: 生成并发布模型卡
        run: |
          node tools/build_model_card.mjs
          node tools/publish_model_card.mjs

      - name: 生成夜间报告
        if: always()
        run: |
          node tools/night_report.mjs
          node tools/night_summary.mjs
          mkdir -p distribution/05_视角与复盘
          {
            echo "# 云端夜间自迭代报告"
            echo ""
            echo "生成时间（UTC）：$(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "触发方式：${{ github.event_name }}"
            echo ""
            echo "## 各步结果"
            echo ""
            echo "| 步骤 | 结果 |"
            echo "|:---|:---|"
            echo "| 单元测试 | ${{ steps.t1.outcome || '见日志' }} |"
            echo ""
            echo "详见本次 Actions 运行日志与下方 artifacts。"
          } > distribution/05_视角与复盘/云端夜间报告.md

      - name: 提交本轮结果（经验库/错误库/历史/报告）
        if: always()
        run: |
          git config user.name  "mackorn-cloud-bot"
          git config user.email "leif.dai@mackorn.cn"
          git add -A distribution/07_库 distribution/03_验证与基准 distribution/05_视角与复盘 || true
          # 心跳文件每次都变（时间戳），所以下面这个判断【几乎不会】走到"无变化"分支
          # —— 这正是我们要的：保证仓库始终有活动，避免 60 天自动禁用。
          if git diff --staged --quiet; then
            echo "本轮无变化，不提交"
          else
            git commit -m "chore(nightly): 云端自迭代 $(date -u '+%Y-%m-%d %H:%M') [skip ci]"
            git push || echo "推送失败（可能无权限）—— 结果仍在 artifacts 中"
          fi

      - name: 上传结果 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-results-${{ github.run_number }}
          path: |
            distribution/03_验证与基准/*.json
            distribution/03_验证与基准/self-iterate-history.jsonl
            distribution/07_库/*.json
            distribution/05_视角与复盘/*.json
          retention-days: 30
