# MACKORN 圆锥破插件 — dsh.bundle 挂载补丁
#
# 这个文件是「可被 dsh plugin add 安装」的关键：
#   1. package.json 里声明 "dsh": { "bundle": { "patch": "./cordis.patch.yml" } }
#   2. 本文件与本 package.json 同目录
#   3. install 时 dsh 读取本文件，按 insert 行把插件挂进 profile
#
# 注册表（awesome-dsh-plugin）明确要求声明 dsh.bundle —— 只声明 dsh.client 无法安装。
# 注意：insert[].name 用**包名**（不是路径）。安装后本包位于 profile 的
# node_modules 中，按包名解析。本地开发用相对路径见 tools/install.ps1。
- insert:
    - id: mackorn-cone-crusher
      name: mackorn-cone-crusher
